services:
  postgres:
    image: postgres:16-alpine
    container_name: orchestr-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestr}
      POSTGRES_DB: ${POSTGRES_DB:-orchestr_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orchestr-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
